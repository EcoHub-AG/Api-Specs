        - processId
        - processName
        - processVersion
        - subProcessName
        - processStatus
        - subProcessStatus
        - eventReceiver
        - eventSender
        - userAgent
        - licenceKey
    iddef:
      description: Identifies the event. Producers MUST ensure that source + id is unique
        for each distinct event. If a duplicate event is re-sent (e.g. due to a network
        error) it MAY have the same id. Consumers MAY assume that Events with identical
        source and id are duplicates.
      example: A234-1234-1234
      minLength: 1
      type: string
    sourcedef:
      description: Uniquely identifies the producer of the event. Must be globally unique,
        including across environments.
      example: http://www.myecohub.ch/iat/ecohub-processes | http://www.myecohub.ch/prod/ecohub-processes | http://www.myecohub.ch/ck/postman
      format: uri-reference
      minLength: 1
      type: string
    specversiondef:
      description: The version of the CloudEvents specification which the event uses. MUST
        be set to 1.0
      example: '1.0'
      minLength: 1
      type: string
    datacontenttypedef:
      description: Content type of the data value. Must adhere to RFC 2046 format.
      example: text/xml | application/json
      minLength: 1
      type: string
    dataschemadef:
      description: Identifies the schema that data adheres to. Must point to the respective raw schema
        in the EcoHub GitHub schema repository (https://github.com/EcoHub-AG/Standards).
      format: uri
      minLength: 1
      type: string
      example:
        https://raw.githubusercontent.com/EcoHub-AG/Standards/refs/tags/Offer_NLPI_v0.3.0/schemas/Offer-NLPI/v0.3.0/offer-nlpi-root/OfferNlpiRequestDataType.json |
        https://raw.githubusercontent.com/EcoHub-AG/Standards/refs/tags/Offer_NLPI_v0.3.0/schemas/Offer-NLPI/v0.3.0/offer-nlpi-root/OfferNlpiDataType.json
    subjectdef:
      description: Describes the subject of the event to provide additional context about
        the event.
      example: Billing november 2024 | MF offer company A
      minLength: 1
      type: string
    timedef:
      description: Timestamp of when the occurrence happened. Must adhere to RFC 3339.
      example: '2018-04-05T17:31:00Z'
      format: date-time
      minLength: 1
      type: string
    EventDataType:
      description: The data transmitted with the event and relevant attributes for signing
        and encryption.
      type: object
      properties:
        payload:
          description: The base64 representation of the first g-zipped and then encrypted
            original payload. For encryption, the AES-GCM algorithm with a 256-bit key,
            a 96-bit initialization vector (IV), and a 128-bit authentication tag must be
            used.
          minLength: 3
          type: string
        payloadSignature:
          description: A digital signature used to verify the origin of the encrypted payload.
            The signature is created by signing the content of the payload attribute using
            the elliptic curve algorithm secp384r1 with a SHA-384 hash, and your active
            signature key. The resulting signature must be ASN.1 encoded and transmitted
            in Base64.
          minLength: 3
          type: string
        links:
          items:
            type: object
            properties:
              description:
                description: Description of the purpose of the link
                type: string
              href:
                description: the- encrypted URL that should be called, to receive additional
                  encrypted unstructured data, such as pdf, pictures, etc.
                example: https://services.test-myecohub.ch/offer/nlpi/{offerId}/{attachmentId}
                  (unencrypted example)
                minLength: 3
                type: string
              rel:
                description: The IG B2B Standard the links belongs to.
                example: offer-nlpi
                minLength: 3
                type: string
            required:
              - href
              - rel
            additionalProperties: false
          type: array
          minItems: 1
        encryptionKey:
          description: The encrypted AES key, which was used to symmetrically encrypt the
            transmitted data. The key must be encrypted with the public key of the eventReceiver
            using RSA with OAEP padding with a SHA256 hash.
          minLength: 3
          type: string
        publicKeyVersion:
          description: The version of the receiver's public key that was used to encrypt
            the encryptionKey.
          type: string
        signatureKeyVersion:
          description: The version of your signature key, that was used to sign the payload.
          type: string
      required:
        - payload
        - payloadSignature
        - encryptionKey
        - publicKeyVersion
        - signatureKeyVersion
      additionalProperties: false
    IDSEventDataType:
      description: IDS event data payload. Contains the encrypted structured extraction result and optional IDS processing metadata grouped by function.
      type: object
      properties:
        payload:
          description: Base64 representation of the gzip-compressed and encrypted structured output from document processing.
          type: string
          minLength: 3
        payloadSignature:
          description: Digital signature for integrity verification of encrypted payload. ECDSA secp384r1/SHA-384, ASN.1 encoded, transmitted as Base64.
          type: string
          minLength: 3
        encryptionKey:
          description: Encrypted AES symmetric key. Encrypted with eventReceiver's public key using RSA/OAEP/SHA-256, transmitted as Base64.
          type: string
          minLength: 3
        publicKeyVersion:
          description: Version identifier of the recipient's public key used to encrypt the encryptionKey.
          type: string
        signatureKeyVersion:
          description: Version identifier of the sender's signature key used to sign the payload.
          type: string
        idsbasicProcessingMetadata:
          description: Model, processing mode, timing and aggregate confidence score. Source of root projections idsconfidenceScore.
          $ref: '#/components/schemas/IDSBasicProcessingMetadataType'
        idsdocumentQualityMetrics:
          description: Source document properties, OCR quality, AGB handling, completeness, and document hash. Source of root projection idsdocumentQuality.
          $ref: '#/components/schemas/IDSDocumentQualityMetricsType'
        idsdetailedExtractionData:
          description: Preprocessing pipeline, preprocessing impact, field extraction details, and field transformations.
          $ref: '#/components/schemas/IDSDetailedExtractionDataType'
          nullable: true
        idsdocumentQualityAssessment:
          description: Quality-factor breakdown and recommended review strategy.
          $ref: '#/components/schemas/IDSDocumentQualityAssessmentType'
          nullable: true
        idsreceiverRecommendations:
          description: Field-level, document-level, and decision-matrix recommendations.
          $ref: '#/components/schemas/IDSReceiverRecommendationsType'
          nullable: true
        idsvalidationResults:
          description: Validation result, routing decision, human-review flag, and business-rule results. Source of root projections idsisValid, idsroutingDecision, idsrequiresHumanReview, and idsreviewReason.
          $ref: '#/components/schemas/IDSValidationResultsType'
        idsfieldExtractionAudit:
          description: Field provenance source audit trail.
          $ref: '#/components/schemas/IDSFieldExtractionAuditType'
          nullable: true
      required:
        - payload
        - payloadSignature
        - encryptionKey
        - publicKeyVersion
        - signatureKeyVersion
      additionalProperties: false
    EventType:
      description: 'Reverse DNS entry to defines the type of event: data, inquiry, standard-error
        or saf-error'
      minLength: 1
      type: string
      enum:
        - ch.ecohub.saf.data
        - ch.ecohub.saf.inquiry
        - ch.ecohub.saf.generic
        - ch.ecohub.saf.ids
        - ch.ecohub.saf.standard-error
        - ch.ecohub.saf.saf-error
    LicenceKeyType:
      description: The license key for the requesting SC application.
      type: string
      maxLength: 200
      minLength: 3
      example: fdsaf346t54grthe65euz467jhz7r
    ProcessIdType:
      description: UUID, that won't change during the offer processes. The UUID is set by
        the party, that starts the process.
      type: string
      format: uuid
    ProcessNameType:
      description: Identifier of the core process
      type: string
      enum:
        - offer.nlpi
        - invoice
        - commission
        - contract
        - mandate
        - claimsExperience
        - claimsExperience.nlpi
    GenericProcessNameType:
      description: Identifier of the generic exchange business process.
      type: string
      enum:
        - offer
        - invoice
        - commission
        - contract
        - mandate
        - claimsExperience
        - claims
        - information
        - customer
        - broker
    ProcessVersionType:
      description: Version of the used core process
      type: string
      pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
    ProcessStatusType:
      description: Defines status of the overall process.
      type: string
      enum:
        - active
        - closed
    SenderReceiverType:
      type: object
      additionalProperties: false
      properties:
        category:
          description: The category of the organisation
          enum:
            - broker
            - insurer
            - serviceprovider
          example: broker
          type: string
        id:
          description: The IDP number of the member's techUser. The IDP number of the eventReceiver
            can be determined through the /saf-receivers endpoint of the General API.
          example: IDP1239856
          minLength: 3
          type: string
        onBehalfBy:
          type: string
          description: The IDP number of the software provider's techUser if the event is
            send on behalf.
          pattern: "^IDP(\\d{7})$"
      required:
        - category
        - id
    SubProcessNameType:
      description: Identifier for the current subprocess / process step within the core
        process.
      type: string
      enum:
        - request
        - offer
        - feedback
        - conclusionDecision
        - billing
        - reminder
        - contract
        - commission
        - submission
        - cancellation
        - claimsExperience
    SubProcessStatusType:
      type: string
      enum:
        - Created
        - Received
        - InProgress
        - Responded
        - Updated
        - Error
        - Inquiry
        - Inquiry_Answer
        - Closed
    BusinessDomainType:
      type: string
      description: Identifier of the business context of the interaction.
      enum:
        - insurance
        - occupationalPension
    UserAgentType:
      type: object
      description: Identifies the software that was used to produce the event
      properties:
        name:
          description: Name of the application
          example: Client software XYZ
          maxLength: 100
          minLength: 3
          type: string
        version:
          description: Used version of the application
          example: Version 1.0
          maxLength: 30
          minLength: 3
          type: string
      required:
        - name
        - version
      additionalProperties: false
    EventResponseType:
      type: object
      properties:
        key_schema_id:
          type: integer
          description: The ID for the schema used to produce keys, or null if keys were not used
        value_schema_id:
          type: integer
          description: The ID for the schema used to produce keys, or null if keys were not used
        offsets:
          type: array
          description: List of partitions and offsets the messages were published to
          items:
            type: object
            properties:
              partition:
                type: integer
                description: Partition the message was published to, or null if publishing the message failed
              offset:
                type: integer
                description: Offset of the message, or null if publishing the message failed
              error_code:
                type: integer
                description: An error code classifying the reason the operation failed, or null if it succeeded
                enum:
                  - 1
                  - 2
              error:
                type: string
                description: An error message describing why the operation failed, or null if it succeeded
    ErrorResponseType:
      type: object
      properties:
        error_code:
          type: integer
          description: HTTP status of the request
        message:
          type: string
          description: message describing the error
    GeneralErrorResponseType:
      type: object
      properties:
        statusCode:
          type: integer
          description: HTTP status of the request
        message:
          type: string
          description: message describing the error
        activityId:
          type: string
          description: Unique ID for the provided error message
          format: uuid
      additionalProperties: false
    EventMessageDataType:
      description: The message transmitted with the event and relevant attributes for signing
        and encryption.
      type: object
      properties:
        encryptionKey:
          description: The encrypted AES key, which was used to symmetrically encrypt the
            transmitted message. The key must be encrypted with the public key of the eventReceiver
            using RSA with OAEP padding with a SHA256 hash.
          minLength: 3
          type: string
        messageSignature:
          description: A digital signature used to verify the origin of the encrypted message.
            The signature is created by signing the content of the payload attribute using
            the elliptic curve algorithm secp384r1 with a SHA-384 hash, and your active
            signature key. The resulting signature must be ASN.1 encoded and transmitted
            in Base64.
          minLength: 3
          type: string
        message:
          description: The base64 representation of the first g-zipped and then encrypted
            original message. For encryption, the AES-GCM algorithm with a 256-bit key,
            a 96-bit initialization vector (IV), and a 128-bit authentication tag must be
            used.
          minLength: 3
          type: string
        publicKeyVersion:
          description: The version of the receiver's public key that was used to encrypt
            the encryptionKey.
          type: string
        signatureKeyVersion:
          description: The version of your signature key, that was used to sign the message.
          type: string
      required:
        - message
        - messageSignature
        - encryptionKey
        - publicKeyVersion
        - signatureKeyVersion
      additionalProperties: false
    SAFErrorEventType:
      description: SAF error event, i.e. an event for errors which are unrelated to the event payload.
